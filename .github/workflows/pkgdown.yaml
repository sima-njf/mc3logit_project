on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the
# in-progress run and the latest queued one. Do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::quarto
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The github-pages environment permits deployments only from the
      # repository's default branch. Gating on that (rather than hard-coding a
      # branch name) means a push to a non-default branch builds and validates
      # the site without attempting a deploy that would be rejected -- and the
      # deploy starts working automatically once the default branch is changed.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Note when the deploy is skipped
        if: github.event_name != 'pull_request' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::notice title=pkgdown deploy skipped::Built the site but did not deploy. Branch '${{ github.ref_name }}' is not the repository default branch ('${{ github.event.repository.default_branch }}'), and the github-pages environment only allows deployments from the default branch. Change the default branch in Settings > General, or add this branch under Settings > Environments > github-pages > Deployment branches."

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
